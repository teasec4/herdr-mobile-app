# herdr-plugin.toml registers Herdr Mobile with herdr as a plugin.
#
# Install/link:
#   herdr plugin link ~/herdr-relay/plugin   # local dev
#   herdr plugin install teasec4/herdr-mobile-app/plugin          # from GitHub (clones the repo)
#
# [[build]] runs install.sh on `plugin install`: it downloads the prebuilt
# relay for this platform/version from the GitHub Release (verified by sha256)
# and installs the launchd service — no Go toolchain needed. If no matching
# release exists yet it falls back to `go build` from the repo root.
# `herdr plugin link` does not run build (see persiyanov/herdr-reviewr
# reference) — locally call:
#   bash plugin/install.sh
#
# After install: herdr plugin action invoke show-pair-link --plugin herdrelay.events
# (or the action via the herdr menu) — opens the pane with the pairing link/QR
# for the phone.

id = "herdrelay.events"
name = "Herdr Mobile"
version = "0.5.0"
description = "Native mobile app for Herdr: watch live agent terminal output, check statuses, and send prompts from your phone over LAN/Tailscale/Funnel"
min_herdr_version = "0.8.0"
# macOS only for now: the [[build]] step installs a launchd service, which is
# macOS-specific. Linux support may come later (systemd unit in install.sh).
platforms = ["macos"]

# Obtain the relay binary into ~/.local/bin/herdrelay (download or go build)
# and install the launchd service (macOS). HERDR_PLUGIN_ROOT is a
# managed/temporary checkout during [[build]], so the binary and plist must
# live outside it.
[[build]]
command = ["bash", "install.sh"]

# NOTE: there is intentionally NO [[events]] hook. Status changes
# (pane.agent_status_changed) and live output (pane.scroll_changed) are
# delivered to the relay over herdr's unix socket subscription
# (internal/infrastructure/herdr/socket_event_repository.go), so the plugin
# hook would only duplicate them (docs/12-fix-plan.md A1).

# Live terminal output (Б-lite) is NOT driven by a plugin hook: herdr's hook
# system rejects every output-ish event name (pane.updated, pane.output_changed,
# pane.scroll_changed — all "unknown event"), so the relay subscribes to
# pane.scroll_changed itself over herdr's unix socket (see internal/infrastructure/herdr/socket_event_repository.go)
# and streams pane.output_changed to the phone.

# "Show QR" — opens the setup pane with the pairing link/QR.
[[actions]]
id = "show-pair-link"
title = "Herdr Mobile: show phone link / QR"
command = ["bash", "open-pane.sh", "setup"]

# "Configure mode" — switch lan / tailscale / funnel / gateway without rebuild.
[[actions]]
id = "configure-relay"
title = "Herdr Mobile: configure mode (lan/tailscale/funnel/gateway)"
command = ["bash", "open-pane.sh", "configure"]

# "Status / logs" — read-only relay state pane (no QR).
[[actions]]
id = "status"
title = "Herdr Mobile: relay status / logs"
command = ["bash", "open-pane.sh", "status"]

# Service control (macOS launchd). uninstall-service keeps the pairing state
# (token/identity), so re-installing reconnects without a new QR.
[[actions]]
id = "start"
title = "Herdr Mobile: start relay service"
command = ["bash", "service-ctl.sh", "start"]

[[actions]]
id = "stop"
title = "Herdr Mobile: stop relay service"
command = ["bash", "service-ctl.sh", "stop"]

[[actions]]
id = "restart"
title = "Herdr Mobile: restart relay service"
command = ["bash", "service-ctl.sh", "restart"]

[[actions]]
id = "uninstall-service"
title = "Herdr Mobile: uninstall relay service (keeps pairing)"
command = ["bash", "service-ctl.sh", "uninstall"]

# Setup pane: relay status and the QR for the phone.
[[panes]]
id = "setup"
title = "Herdr Mobile: Setup"
placement = "zoomed"
command = ["bash", "setup-menu.sh"]

# Status pane: relay health + logs.
[[panes]]
id = "status"
title = "Herdr Mobile: Status"
placement = "zoomed"
command = ["bash", "status-menu.sh"]

# Configure pane: interactive mode selection menu.
[[panes]]
id = "configure"
title = "Herdr Mobile: Configure mode"
placement = "zoomed"
command = ["bash", "configure.sh"]
