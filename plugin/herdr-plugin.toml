# herdr-plugin.toml registers HerdRelay with herdr as a plugin.
#
# Install/link:
#   herdr plugin link /Users/yg_kovalev/go/herdr_relay/plugin   # local dev
#   herdr plugin install yg_kovalev/herdr_relay/plugin          # from GitHub (clones the repo)
#
# [[build]] runs install.sh on `plugin install`: builds the Go relay from the
# repo root into bin/ and installs the launchd service. `herdr plugin link`
# does not run build (see persiyanov/herdr-reviewr reference) — locally call:
#   bash plugin/install.sh
#
# After install: herdr plugin action invoke show-pair-link --plugin herdrelay.events
# (or the action via the herdr menu) — opens the pane with the pairing link/QR
# for the phone.

id = "herdrelay.events"
name = "HerdRelay"
version = "0.1.0"
description = "Remote control for Herdr: monitor and check agents from your phone over LAN/Tailscale"
min_herdr_version = "0.7.5"
platforms = ["macos", "linux"]

# Build the Go relay into bin/ and install the launchd service (macOS).
[[build]]
command = ["bash", "install.sh"]

# NOTE: there is intentionally NO [[events]] hook. Status changes
# (pane.agent_status_changed) and live output (pane.scroll_changed) are
# delivered to the relay over herdr's unix socket subscription
# (internal/infrastructure/herdr/socket_event_repository.go), so the plugin
# hook would only duplicate them (docs/12-fix-plan.md A1).

# Live terminal output (Б-lite) is NOT driven by a plugin hook: herdr's hook
# system rejects every output-ish event name (pane.updated, pane.output_changed,
# pane.scroll_changed — all "unknown event"), so the relay subscribes to
# pane.scroll_changed itself over herdr's unix socket (see cmd/relay/herdrevents.go)
# and streams pane.output_changed to the phone.

# "Show QR" — opens the setup pane with the pairing link/QR.
[[actions]]
id = "show-pair-link"
title = "HerdRelay: show phone link / QR"
command = ["bash", "open-pane.sh", "setup"]

# "Configure mode" — switch lan / tailscale / funnel / gateway without rebuild.
[[actions]]
id = "configure-relay"
title = "HerdRelay: configure mode (lan/tailscale/funnel/gateway)"
command = ["bash", "open-pane.sh", "configure"]

# Setup pane: relay status and the QR for the phone.
[[panes]]
id = "setup"
title = "HerdRelay: Setup"
placement = "zoomed"
command = ["bash", "setup-menu.sh"]

# Configure pane: interactive mode selection menu.
[[panes]]
id = "configure"
title = "HerdRelay: Configure mode"
placement = "zoomed"
command = ["bash", "configure.sh"]
